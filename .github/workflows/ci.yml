name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shell syntax
        run: bash -n tests/run
      - name: Run portable tests
        run: ./tests/run

  release:
    name: Release tag matches manifest and changelog
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/check-release "$GITHUB_REF_NAME"

  # The QML side (qmllint, the QML contracts, plugin validation) needs Quickshell, Qt 6's qmllint and the Omarchy shell
  # source the plugin imports, as Omarchy installs them (tests/install-qml-deps), and a Wayland session for the
  # contracts that drive the whole panel, its chips and the live runtime: a headless sway (tests/headless-wayland), where
  # their test windows bother nobody. The shell comes from Omarchy's git repository at the release the plugin targets.
  # Without these the portable job above skips every QML check.
  qml:
    name: QML (Quickshell, Omarchy ${{ matrix.omarchy }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        omarchy: ["v4.0.6", "v4.5.0"]
    env:
      QUOTATANK_REQUIRE_QML: "1"
      QUOTATANK_LIVE_TESTS: "1"
      OMARCHY_QUATTRO_PATH: /tmp/omarchy
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Install Quickshell (Omarchy's build), Qt, sway and tools
        run: tests/install-qml-deps
      - name: Fetch the Omarchy shell
        run: git clone --depth 1 --branch "${{ matrix.omarchy }}" https://github.com/basecamp/omarchy.git "$OMARCHY_QUATTRO_PATH"
      - name: Run the suite with the QML checks, Wayland contracts included
        run: tests/headless-wayland ./tests/run
